spring:
  application:
    name: wb-price-monitor
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wbmon}
    username: ${DB_USER:wbmon}
    password: ${DB_PASSWORD:wbmon_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

wbmon:
  wb:
    base-url: ${WB_BASE_URL:https://card.wb.ru}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    # 3 ретрая с паузами 1s → 3s → 9s
    max-retries: 3
    backoff-initial-ms: 1000
    backoff-multiplier: 3

logging:
  level:
    dev.portfolio.wbmon: INFO

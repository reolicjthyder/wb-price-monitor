spring:
  application:
    name: wb-price-monitor
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wbmon}
    username: ${DB_USER:wbmon}
    password: ${DB_PASSWORD:wbmon_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    dev.portfolio.wbmon: INFO

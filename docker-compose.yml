services:
  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: wbmon
      POSTGRES_USER: wbmon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wbmon_local}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wbmon -d wbmon"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
